name: 좌석 대기 예약

on:
  workflow_dispatch:
    inputs:
      duration_min:
        description: "대기할 시간(분, 최대 350)"
        default: "120"
      rooms:
        description: "열람실, 쉼표로 구분, 앞쪽일수록 우선 (예: 3열람실-A, 3열람실-D) 비우면 ROOMS 변수"
        default: ""
      seats:
        description: "선호 좌석, 쉼표로 구분. 50 / 3열람실-A:50 / 3열람실-A:* (비우면 아무 자리)"
        default: ""
      mode:
        description: "reserve: 예약 / notify: 알림만 / check: 로그인·조회만 시험"
        type: choice
        options: [reserve, notify, check]
        default: reserve

# 동시에 두 개가 돌면 좌석을 두 번 잡으려 할 수 있으므로 하나만 실행한다.
concurrency:
  group: seatbot
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m seatbot
        env:
          PNU_ID: ${{ secrets.PNU_ID }}
          PNU_PW: ${{ secrets.PNU_PW }}
          ROOMS: ${{ inputs.rooms || vars.ROOMS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          INTERVAL_SEC: ${{ vars.INTERVAL_SEC || '3' }}
          DURATION_MIN: ${{ inputs.duration_min }}
          SEATS: ${{ inputs.seats }}
          MODE: ${{ inputs.mode }}
